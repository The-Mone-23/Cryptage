<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>CRYPTED LANGUAGE</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <main class="app">
        <h1>CRYPTED LANGUAGE</h1>

        <section>
            <label for="inputArea" class="input-label">INPUT</label>
            <textarea id="inputArea"></textarea>
        </section>

        <section>
            <label for="outputArea" class="output-label">OUTPUT</label>
            <textarea id="outputArea" readonly></textarea>
        </section>

        <div class="buttons">
            <button type="button" id="encryptButton">ENCRYPT</button>
            <button type="button" id="decryptButton">DECRYPT</button>
            <button type="button" id="clearButton">CLEAR</button>
        </div>
    </main>

</body>
</html>
